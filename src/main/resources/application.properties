# =====================================================
# ESPRIT LMS — Shared Configuration
# =====================================================
spring.application.name=esprit-lms

# =====================================================
# Server
# =====================================================
server.port=8080
server.servlet.context-path=/

# =====================================================
# JPA / Hibernate
# =====================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# =====================================================
# Flyway
# =====================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# =====================================================
# Actuator
# =====================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# =====================================================
# MinIO
# =====================================================
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket.documents=lms-documents
minio.bucket.covers=lms-covers

# =====================================================
# DGX AI Server (vLLM — OpenAI-compatible API)
# =====================================================
ai.embedding.url=${AI_EMBEDDING_URL:http://localhost:8001}
ai.embedding.model=bge-m3
ai.generation.url=${AI_GENERATION_URL:http://localhost:8002}
ai.generation.model=qwen2.5-14b

# =====================================================
# Auth Microservice (JWT Validation)
# =====================================================
auth.jwt.secret=${AUTH_JWT_SECRET:}
auth.jwt.issuer=${AUTH_JWT_ISSUER:esprit-auth}

# =====================================================
# CORS
# =====================================================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}

# =====================================================
# File Upload
# =====================================================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# =====================================================
# Async Thread Pool (for AI indexing pipeline)
# =====================================================
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=50
spring.task.execution.thread-name-prefix=lms-async-
