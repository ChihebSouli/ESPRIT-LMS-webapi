# =====================================================
# ESPRIT LMS — On-Premise Profile
# =====================================================
# Database (Docker Compose postgres service)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lms}
spring.datasource.username=${DB_USERNAME:lms}
spring.datasource.password=${DB_PASSWORD:lms}

# Email via SMTP / Mailhog (dev)
spring.mail.host=${EMAIL_SMTP_HOST:localhost}
spring.mail.port=${EMAIL_SMTP_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.email.provider=smtp
app.email.from=${EMAIL_FROM:noreply@esprit.tn}
